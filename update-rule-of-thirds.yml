name: Update Ford Rule of Thirds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Ford Rule of Thirds
        run: python calculate_rule_of_thirds.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results/
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "Update Ford Rule of Thirds"
            git push
          fi
